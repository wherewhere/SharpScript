    <style>
        :root {
            --neutral-fill-stealth-rest: #fbfbfb;
        }

        .body,
        body,
        #vue-app div.cover {
            background: #fbfbfb;
        }

        #vue-app div.cover {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
        }

        .pace {
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }

            .pace .pace-progress {
                background: #036ac4;
                position: fixed;
                z-index: 4;
                bottom: 0;
                right: 100%;
                width: 100%;
                height: 3px;
                transition: all 0.2s ease-in-out;
            }

        .pace-inactive {
            display: none;
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --neutral-fill-stealth-rest: #272727;
            }

            #vue-app div.cover,
            .body,
            body {
                background: #272727;
            }

            .pace .pace-progress {
                background: #60c9fc;
            }
        }
    </style>
